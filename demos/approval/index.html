<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>审批流系统 · 演示样例</title>
<meta name="description" content="后台管理系统演示：发起审批、待办已办、流程节点图、同意与驳回留痕。演示样例 · Demo，非真实客户项目。">
<style>
  :root{
    --bg:#f5f7f9;--panel:#fff;--ink:#1b2733;--ink2:#48596a;--mut:#8494a3;
    --line:#e4eaef;--line2:#d0dbe4;
    --teal:#0e7c86;--teal-soft:#e5f3f5;--teal-deep:#0a5b62;
    --amber:#b7791f;--amber-soft:#fdf4e5;--red:#bf3b2f;--red-soft:#fbeceb;
    --green:#217a55;--green-soft:#e7f4ee;--indigo:#4b5bab;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"PingFang SC","Microsoft YaHei",-apple-system,"Segoe UI",sans-serif;font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}
  button{font-family:inherit}

  .demo-note{background:#10222a;color:#b6cbd2;font-size:11px;text-align:center;padding:6px 12px}
  .demo-note b{color:#7fd8c4}
  .demo-note a{color:#7fd8c4;margin-left:8px}

  .layout{display:flex;min-height:calc(100vh - 26px)}
  .side{width:196px;flex:0 0 196px;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:calc(100vh - 26px)}
  .side-logo{padding:18px 18px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:9px}
  .side-logo i{width:28px;height:28px;border-radius:8px;background:var(--teal);color:#fff;display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:700}
  .side-logo b{font-size:13.5px;letter-spacing:.02em;line-height:1.25}
  .side-logo span{display:block;font-size:9.5px;color:var(--mut);letter-spacing:.1em}
  .side-nav{padding:12px 10px;flex:1}
  .side-nav .g{font-size:10px;letter-spacing:.14em;color:#9aa9b6;padding:12px 9px 5px}
  .side-nav a{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:6px;font-size:13px;color:var(--ink2);margin-bottom:2px}
  .side-nav a:hover{background:#f3f7f9;color:var(--ink)}
  .side-nav a.on{background:var(--teal-soft);color:var(--teal-deep);font-weight:600}
  .side-nav .num{margin-left:auto;font-size:10px;background:#e9eff4;color:#5b6c7b;border-radius:8px;padding:0 6px}
  .side-nav a.on .num{background:#fff;color:var(--teal)}
  .side-foot{padding:12px 16px;border-top:1px solid var(--line);font-size:11px;color:var(--mut)}

  .main{flex:1;min-width:0}
  .topbar{height:56px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 22px;position:sticky;top:0;z-index:20}
  .topbar .t{font-size:14px;font-weight:600}
  .topbar .env{font-size:10px;background:#f1f5f8;color:#6b7d8d;padding:2px 7px;border-radius:3px;letter-spacing:.06em}
  .topbar .r{margin-left:auto;display:flex;align-items:center;gap:12px;font-size:12px;color:var(--mut)}
  .avatar{width:28px;height:28px;border-radius:50%;background:#d9eef0;color:var(--teal-deep);display:grid;place-items:center;font-size:11px;font-weight:600}

  .content{padding:18px 20px 30px}
  .head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:14px}
  .head h1{margin:0;font-size:19px;font-weight:600}
  .head p{margin:3px 0 0;font-size:11.5px;color:var(--mut)}
  .btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:6px;border:1px solid var(--line2);background:#fff;font-size:12.5px;color:var(--ink2);cursor:pointer}
  .btn:hover{border-color:#a3b6c5;color:var(--ink)}
  .btn-p{background:var(--teal);border-color:var(--teal);color:#fff}
  .btn-p:hover{background:var(--teal-deep);color:#fff}
  .btn-danger{background:#fff;border-color:#e2b8b3;color:var(--red)}
  .btn-danger:hover{background:var(--red-soft)}
  .btn:disabled{opacity:.45;cursor:not-allowed}

  .mini{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
  .mini div{background:#fff;border:1px solid var(--line);border-radius:7px;padding:10px 14px;flex:1;min-width:120px}
  .mini .k{font-size:11px;color:var(--mut)}
  .mini strong{font-size:19px;font-weight:600;letter-spacing:-.01em}
  .mini strong em{font-style:normal;font-size:11px;color:var(--mut);margin-left:3px}

  .tabs{display:flex;gap:2px;border-bottom:1px solid var(--line)}
  .tabs button{background:none;border:none;padding:9px 15px;font-size:13px;color:var(--ink2);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
  .tabs button.on{color:var(--teal);border-color:var(--teal);font-weight:600}
  .tabs button .n{font-size:10px;background:var(--teal-soft);color:var(--teal);border-radius:8px;padding:0 5px;margin-left:4px}

  .workspace{display:grid;grid-template-columns:368px 1fr;gap:0;background:#fff;border:1px solid var(--line);border-top:none;border-radius:0 0 8px 8px;min-height:520px}
  @media(max-width:900px){.workspace{grid-template-columns:1fr}}
  .list{border-right:1px solid var(--line);max-height:640px;overflow-y:auto}
  @media(max-width:900px){.list{border-right:none;border-bottom:1px solid var(--line);max-height:280px}}
  .item{padding:13px 16px;border-bottom:1px solid #eef2f5;cursor:pointer;position:relative}
  .item:hover{background:#f7fafb}
  .item.on{background:var(--teal-soft)}
  .item.on:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--teal)}
  .item .r1{display:flex;align-items:center;gap:8px;margin-bottom:5px}
  .itype{font-size:10px;padding:1px 6px;border-radius:3px;background:#eef2f6;color:#5d6f7e;white-space:nowrap}
  .item .ttl{font-size:13px;font-weight:600;color:var(--ink);margin-bottom:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .item .r2{display:flex;justify-content:space-between;gap:10px;font-size:11px;color:var(--mut)}
  .dot{width:6px;height:6px;border-radius:50%;display:inline-block;margin-right:4px}
  .d-red{background:#d9534f}.d-amber{background:#d9a441}.d-gray{background:#c3ced7}

  .detail{padding:20px 22px 24px;min-width:0}
  @media(max-width:520px){.detail{padding:16px}}
  .d-head{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:16px}
  .d-head h2{margin:0 0 4px;font-size:17px;font-weight:600}
  .d-head .meta{font-size:11.5px;color:var(--mut)}
  .stamp{font-size:11px;padding:3px 9px;border-radius:4px;height:fit-content}
  .s-wait{background:var(--amber-soft);color:var(--amber);border:1px solid #f0ddb9}
  .s-ok{background:var(--green-soft);color:var(--green)}
  .s-rej{background:var(--red-soft);color:var(--red)}

  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1px solid var(--line);border-radius:6px;overflow:hidden;margin-bottom:20px}
  @media(max-width:600px){.form-grid{grid-template-columns:1fr}}
  .form-grid div{padding:10px 14px;border-bottom:1px solid var(--line);font-size:12.5px}
  .form-grid div:nth-child(odd){border-right:1px solid var(--line);background:#fbfcfd;color:var(--mut);width:auto}
  @media(max-width:600px){.form-grid div:nth-child(odd){border-right:none}}
  .form-grid .full{grid-column:1/-1;border-right:none !important;background:#fff !important;color:var(--ink) !important}
  .form-grid div:nth-child(even){color:var(--ink);font-weight:500}

  .sec-t{font-size:11px;letter-spacing:.12em;color:var(--mut);font-weight:600;margin:0 0 14px}

  /* flow nodes */
  .flow{position:relative;padding-left:6px;margin-bottom:8px}
  .node{display:grid;grid-template-columns:26px 1fr auto;gap:12px;position:relative;padding-bottom:22px}
  .node:last-child{padding-bottom:0}
  .node .rail{position:relative;display:flex;justify-content:center}
  .node .rail i{
    width:22px;height:22px;border-radius:50%;background:#fff;border:2px solid var(--line2);
    display:grid;place-items:center;font-size:10px;font-style:normal;color:var(--mut);z-index:2;flex:0 0 auto;
  }
  .node:not(:last-child) .rail:after{content:"";position:absolute;top:22px;bottom:-22px;width:2px;background:var(--line);z-index:1}
  .node.done .rail i{background:var(--green);border-color:var(--green);color:#fff}
  .node.done:not(:last-child) .rail:after{background:#bfe0d0}
  .node.cur .rail i{background:#fff;border-color:var(--teal);color:var(--teal);box-shadow:0 0 0 4px rgba(14,124,134,.12)}
  .node.cur:not(:last-child) .rail:after{background:linear-gradient(var(--teal),var(--line))}
  .node .body{padding-top:1px}
  .node .body b{font-size:13px;font-weight:600;display:block}
  .node .body span{font-size:11px;color:var(--mut);display:block;margin-top:1px}
  .node .body .cmt{margin-top:6px;font-size:11.5px;color:var(--ink2);background:#f7fafb;border-left:2px solid var(--line2);padding:6px 9px;border-radius:0 4px 4px 0}
  .node .t{font-size:10.5px;color:var(--mut);white-space:nowrap;padding-top:2px}
  .node.pend .rail i{border-style:dashed}

  .actions{display:flex;gap:8px;margin-top:20px;padding-top:16px;border-top:1px solid var(--line);flex-wrap:wrap}
  .actions .sp{flex:1}

  .empty-d{display:grid;place-items:center;height:100%;min-height:300px;color:var(--mut);font-size:12.5px;text-align:center}

  /* modal */
  .mask{position:fixed;inset:0;background:rgba(18,32,42,.36);z-index:80;display:none;align-items:center;justify-content:center;padding:20px}
  .mask.on{display:flex}
  .modal{background:#fff;border-radius:10px;width:440px;max-width:100%;box-shadow:0 20px 50px rgba(10,20,30,.22);overflow:hidden}
  .modal h3{margin:0;font-size:15px;padding:16px 20px;border-bottom:1px solid var(--line);font-weight:600}
  .modal .b{padding:18px 20px}
  .modal textarea{width:100%;border:1px solid var(--line2);border-radius:6px;padding:10px;font-family:inherit;font-size:13px;min-height:88px;resize:vertical;outline:none}
  .modal textarea:focus{border-color:var(--teal)}
  .modal .f{padding:12px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;background:#fbfcfd}
  .modal .tt{font-size:12px;color:var(--mut);margin-bottom:8px}
</style>
</head>

      </div>
    </div>
  </div>
</div>

<div class="mask" id="mask">
  <div class="modal">
    <h3 id="mTitle">审批意见</h3>

    <div class="f">
      <button class="btn" id="mCancel">取消</button>
      <button class="btn btn-p" id="mOk">确认</button>
    </div>
  </div>
</div>

var curView = 'todo';
var curItem = null;
var listEl = document.getElementById('list');
var detailEl = document.getElementById('detail');

function statusStamp(s){
  if(s === 'ok') return '<span class="stamp s-ok">已通过</span>';
  if(s === 'rej') return '<span class="stamp s-rej">已驳回</span>';
  return '<span class="stamp s-wait">待处理</span>';
}

function renderList(){
  var arr = FLOWS[curView];
  listEl.innerHTML = arr.map(function(f, i){
    var dot = f.status === 'wait' ? (f.urgent ? 'd-red' : 'd-amber') : (f.status === 'rej' ? 'd-red' : 'd-gray');
    return '<div class="item'+(i===0?' on':'')+'" data-i="'+i+'">'
      + '<div class="r1"><span class="itype">'+f.type+'</span><span style="font-size:10.5px;color:#8494a3">'+f.id+'</span></div>'
      + '<div class="ttl">'+f.title+'</div>'
      + '<div class="r2"><span><i class="dot '+dot+'"></i>'+f.applicant+'</span><span>'+f.time+'</span></div>'
      + '</div>';
  }).join('');
  openItem(0);
}

function nodeHTML(n){
  var cls = n.st === 'done' ? 'done' : (n.st === 'cur' ? 'cur' : (n.st === 'rej' ? 'rej' : 'pend'));
  var mark = n.st === 'done' ? '✓' : (n.st === 'rej' ? '×' : (n.st === 'cur' ? '●' : ''));
  var cmt = n.cmt ? '<div class="cmt">'+n.cmt+'</div>' : '';
  return '<div class="node '+cls+'">'
    + '<div class="rail"><i>'+mark+'</i></div>'
    + '<div class="body"><b>'+n.who+'</b><span>'+n.role+'</span>'+cmt+'</div>'
    + '<div class="t">'+n.time+'</div>'
    + '</div>';
}

function openItem(i){
  var arr = FLOWS[curView];
  var f = arr[i];
  if(!f) return;
  curItem = f;
  var items = listEl.querySelectorAll('.item');
  for(var k=0;k<items.length;k++) items[k].classList.toggle('on', +items[k].getAttribute('data-i') === i);

  var fields = f.fields.map(function(x){ return '<div>'+x[0]+'</div><div>'+x[1]+'</div>'; }).join('');
  var actions = '';
  if(f.status === 'wait' && curView !== 'mine'){
    actions = '<div class="actions">'
      + '<button class="btn btn-p" data-act="ok">同意</button>'
      + '<button class="btn btn-danger" data-act="rej">驳回</button>'
      + '<button class="btn" data-act="tr">转交</button>'
      + '<div class="sp"></div>'
      + '<span style="font-size:11px;color:#8494a3;align-self:center">当前节点：'+ (f.nodes.filter(function(n){return n.st==='cur';})[0] || {who:'—'}).who +'</span>'
      + '</div>';
  } else if(curView === 'mine'){
    actions = '<div class="actions"><button class="btn" data-act="urge">催办</button><button class="btn" data-act="cancel">撤回</button></div>';
  }

  detailEl.innerHTML = '<div class="d-head">'
    + '<div><h2>'+f.title+'</h2><div class="meta">'+f.id+' · '+f.type+' · 发起人 '+f.applicant+' · '+f.time+'</div></div>'
    + statusStamp(f.status)
    + '</div>'
    + '<div class="form-grid">'+fields+'<div class="full">申请说明：'+f.desc+'</div></div>'
    + '<div class="sec-t">流程节点</div>'
    + '<div class="flow">'+f.nodes.map(nodeHTML).join('')+'</div>'
    + actions;
}

listEl.addEventListener('click', function(e){
  var it = e.target.closest('.item');
  if(!it) return;
  openItem(+it.getAttribute('data-i'));
});

detailEl.addEventListener('click', function(e){
  var b = e.target.closest('button[data-act]');
  if(!b) return;
  var act = b.getAttribute('data-act');
  if(act === 'ok') ask('同意审批', '填写同意意见（会记录在流程节点上）。', '同意，符合规定。');
  if(act === 'rej') ask('驳回审批', '请说明驳回理由，发起人会收到通知。', '');
  if(act === 'tr') ask('转交审批', '请填写转交对象与原因。', '');
  if(act === 'urge') alert('演示环境：已模拟向当前审批人发送催办提醒。');
  if(act === 'cancel') alert('演示环境：撤回操作仅作提示，不改变数据。');
});

/* modal */
var mask = document.getElementById('mask');
var mTitle = document.getElementById('mTitle');
var mText = document.getElementById('mText');
var mTip = document.getElementById('mTip');
var pendingAct = null;

function ask(title, tip, preset){
  mTitle.textContent = title;
  mTip.textContent = tip;
  mText.value = preset || '';
  pendingAct = title;
  mask.classList.add('on');
  setTimeout(function(){ mText.focus(); }, 60);
}

document.getElementById('mCancel').addEventListener('click', function(){ mask.classList.remove('on'); });
document.getElementById('mOk').addEventListener('click', function(){
  mask.classList.remove('on');
  if(!curItem) return;
  var node = curItem.nodes.filter(function(n){ return n.st === 'cur'; })[0];
  if(node){
    if(pendingAct === '同意审批'){ node.st = 'done'; node.time = '刚刚'; node.cmt = mText.value || '同意。'; }
    if(pendingAct === '驳回审批'){ node.st = 'rej'; node.time = '刚刚'; node.cmt = mText.value || '驳回。'; }
  }
  openItem(FLOWS[curView].indexOf(curItem));
});

document.getElementById('tabs').addEventListener('click', function(e){
  var b = e.target.closest('button');
  if(!b) return;
  var all = this.querySelectorAll('button');
  for(var i=0;i<all.length;i++) all[i].classList.toggle('on', all[i]===b);
  curView = b.getAttribute('data-v');
  renderList();
});

document.getElementById('newBtn').addEventListener('click', function(){
  alert('演示环境：发起审批将进入表单填写页，此处仅作入口占位。');
});

renderList();
</script>
