<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>离线设备诊断助手 · 演示样例</title>
<meta name="description" content="AI 私有化部署演示：离线模式下的设备故障问答，回答带手册章节引用，支持上传故障照片与兜底转人工。演示样例 · Demo。">
<style>
  :root{
    --bg:#12171b;--panel:#1a2025;--panel2:#151b20;--line:#273037;--line2:#323d45;
    --ink:#e2e9ed;--ink2:#b3c1ca;--mut:#7d8e9a;
    --amber:#e0a23c;--amber2:#c4872a;--green:#4ecb8b;--red:#e2584d;--blue:#5aa9e6;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink)}
  body{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",-apple-system,"Segoe UI",sans-serif;font-size:13.5px;line-height:1.65;-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}
  button,input,textarea{font-family:inherit;font-size:inherit;color:inherit}
  button{cursor:pointer;border:0;background:none}
  .mono{font-family:var(--mono)}

  .ribbon{background:#2a1f0d;border-bottom:1px solid #4a3716;color:#e8c98d;font-size:11.5px;padding:7px 14px;text-align:center;letter-spacing:.02em}
  .ribbon b{color:#f2b455;font-weight:600}

  .top{display:flex;align-items:center;gap:14px;padding:12px 18px;background:var(--panel2);border-bottom:1px solid var(--line);flex-wrap:wrap}
  .logo{display:flex;align-items:center;gap:9px;min-width:0}
  .logo .mk{width:30px;height:30px;border-radius:7px;background:linear-gradient(135deg,#3a2c14,#c4872a);display:grid;place-items:center;flex:none}
  .logo .mk svg{width:16px;height:16px;stroke:#1a1206;stroke-width:2;fill:none}
  .logo b{font-size:14px;letter-spacing:.02em}
  .logo span{display:block;font-size:9.5px;color:var(--mut);letter-spacing:.12em;font-family:var(--mono)}
  .status{display:flex;gap:7px;margin-left:auto;flex-wrap:wrap}
  .pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;border:1px solid var(--line2);background:#101519;border-radius:999px;padding:5px 11px;color:var(--ink2);white-space:nowrap}
  .pill .dot{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 7px var(--green)}
  .pill.warn{border-color:#5a4217;color:#e5b566;background:#211909}
  .pill.warn .dot{background:var(--amber);box-shadow:0 0 7px var(--amber)}

  .layout{display:flex;min-height:calc(100vh - 104px)}
  .side{width:262px;flex:none;background:var(--panel2);border-right:1px solid var(--line);padding:14px 12px;display:flex;flex-direction:column;gap:14px}
  .side h4{margin:0 0 7px;font-size:10.5px;letter-spacing:.16em;color:var(--mut);font-family:var(--mono);font-weight:500}
  .dev{width:100%;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:9px 11px;margin-bottom:6px;transition:.15s}
  .dev:hover{border-color:var(--line2);background:#1f272d}
  .dev.on{border-color:var(--amber);background:#231b0e;box-shadow:inset 0 0 0 1px rgba(224,162,60,.35)}
  .dev b{display:block;font-size:12.8px;font-weight:600}
  .dev small{display:block;font-size:10.5px;color:var(--mut);margin-top:2px;font-family:var(--mono)}
  .dev .st{float:right;font-size:10px;padding:1px 6px;border-radius:3px;background:rgba(78,203,139,.12);color:var(--green);margin-top:1px}
  .dev .st.w{background:rgba(224,162,60,.12);color:var(--amber)}
  .kb{border:1px solid var(--line);border-radius:8px;padding:10px 11px;background:var(--panel);font-size:11.5px;color:var(--mut);line-height:1.8}
  .kb b{color:var(--ink2);font-weight:500}
  .kb .bar{height:4px;border-radius:2px;background:#0f1418;margin:7px 0 5px;overflow:hidden}
  .kb .bar i{display:block;height:100%;width:82%;background:linear-gradient(90deg,#3b6b52,#4ecb8b)}
  .side-foot{margin-top:auto;font-size:10.5px;color:#5f6d78;line-height:1.75;border-top:1px solid var(--line);padding-top:10px}
  .side-foot b{color:#8b6b3a;font-weight:500}

  .main{flex:1;min-width:0;display:flex;flex-direction:column}
  .chat{flex:1;overflow-y:auto;padding:20px 22px 8px;max-width:860px;width:100%;margin:0 auto}
  .msg{display:flex;gap:9px;margin-bottom:16px;align-items:flex-start}
  .msg.me{flex-direction:row-reverse}
  .av{width:27px;height:27px;border-radius:6px;flex:none;display:grid;place-items:center;font-size:10.5px;font-family:var(--mono)}
  .av.ai{background:#2a2110;border:1px solid #4d3a17;color:var(--amber)}
  .av.me{background:#1c2a33;border:1px solid #2c4250;color:#9dc6e2}
  .bub{max-width:76%;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:11px 14px;font-size:13px;color:var(--ink2)}
  .msg.me .bub{background:#1d2a33;border-color:#2b3d49;color:#d5e2eb}
  .bub .h{color:#fff;font-weight:600;font-size:13.5px;margin-bottom:6px;display:block}
  .bub ol,.bub ul{margin:6px 0 0;padding-left:19px}
  .bub li{margin:3px 0}
  .bub p{margin:0 0 6px}
  .bub p:last-child{margin-bottom:0}
  .cite{margin-top:9px;border-left:2px solid var(--amber);background:#191f17;border-radius:0 6px 6px 0;padding:8px 11px;font-size:11.8px;color:#a9b7ae}
  .cite b{display:block;color:var(--amber);font-weight:600;font-size:11.5px;margin-bottom:3px}
  .cite span{font-family:var(--mono);font-size:10px;color:#6f7d72;display:block;margin-top:4px}
  .alarm{display:inline-block;font-size:10.5px;font-family:var(--mono);padding:1px 6px;border-radius:3px;background:rgba(226,88,77,.13);color:#ef8279;border:1px solid rgba(226,88,77,.25);margin-right:5px}
  .safe{margin-top:9px;border:1px dashed #4a3a1e;background:#1d180e;border-radius:6px;padding:9px 11px;font-size:11.8px;color:#d3b783}
  .safe b{color:var(--amber)}

  .photo{margin:0 0 12px;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:#0f1418}
  .photo .ph{height:132px;display:grid;place-items:center;text-align:center;background:
      repeating-linear-gradient(135deg,#171d22 0 2px,#141a1f 2px 10px);border-bottom:1px solid var(--line)}
  .photo .ph b{font-size:11px;letter-spacing:.16em;color:#6b7a85;font-weight:400}
  .photo .ph span{display:block;font-size:10px;color:#55626c;margin-top:4px}
  .photo .rs{padding:9px 12px;font-size:11.8px;color:var(--ink2)}
  .photo .rs strong{color:var(--amber);font-weight:600}
  .photo .rs ol{margin:5px 0 0;padding-left:17px}
  .photo .rs li{margin:2px 0}

  .composer{border-top:1px solid var(--line);background:var(--panel2);padding:12px 22px 16px}
  .composer .in{max-width:860px;margin:0 auto}
  .quick{display:flex;gap:7px;overflow-x:auto;padding-bottom:9px;scrollbar-width:none}
  .quick::-webkit-scrollbar{display:none}
  .quick button{flex:0 0 auto;font-size:11.5px;color:#9fb0bb;border:1px solid var(--line2);background:#12181c;border-radius:999px;padding:5px 11px;white-space:nowrap}
  .quick button:hover{border-color:var(--amber);color:var(--amber)}
  .row{display:flex;gap:8px;align-items:flex-end}
  .row textarea{flex:1;resize:none;height:44px;background:#0f1418;border:1px solid var(--line2);border-radius:8px;padding:11px 12px;font-size:13px;line-height:1.45;outline:none}
  .row textarea:focus{border-color:var(--amber)}
  .send{width:44px;height:44px;border-radius:8px;background:var(--amber);color:#1a1206;display:grid;place-items:center;flex:none;font-size:16px}
  .send:hover{background:#f0b455}
  .tools{display:flex;gap:14px;align-items:center;margin-top:8px;flex-wrap:wrap}
  .tool{font-size:11.5px;color:var(--mut);display:inline-flex;align-items:center;gap:5px}
  .tool:hover{color:var(--amber)}
  .tool svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.7}
  .typing span{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--mut);margin-right:3px;animation:bl 1.1s infinite}
  .typing span:nth-child(2){animation-delay:.15s}
  .typing span:nth-child(3){animation-delay:.3s}
  @keyframes bl{0%,100%{opacity:.25}50%{opacity:1}}

  @media (max-width:820px){
    .layout{flex-direction:column}
    .side{width:auto;border-right:none;border-bottom:1px solid var(--line);flex-direction:row;overflow-x:auto;gap:8px;padding:10px}
    .side h4,.kb,.side-foot{display:none}
    .dev{flex:0 0 auto;width:170px;margin-bottom:0}
    .chat{padding:16px 14px 6px}
    .bub{max-width:88%}
    .composer{padding:10px 14px 14px}
  }
</style>
</head>
<body>

<div class="ribbon"><b>演示样例 · DEMO</b>　回复为本地预设，未接入真实模型；本页不连接任何外部网络、不上传任何文件。</div>

<div class="top">
  <div class="logo">
    <span class="mk"><svg viewBox="0 0 24 24"><path d="M4 17V9m4 8V5m4 12v-6m4 6V7m4 10v-3"/></svg></span>
    <div><b>离线设备诊断助手</b><span>OFFLINE ASSIST / ON-PREMISE</span></div>
  </div>
  <div class="status">
    <span class="pill"><span class="dot"></span>离线模式 · 无外网连接</span>
    <span class="pill">本地模型 7B 量化 <span class="mono" style="color:#5f6d78">(演示)</span></span>
    <span class="pill warn"><span class="dot"></span>知识库 4 台设备 · 82 节</span>
  </div>
</div>

<div class="layout">
  <aside class="side">
    <div>
      <h4>设备列表</h4>
      <div id="devs"></div>
    </div>
    <div class="kb">
      <b>本地知识库</b>
      <div class="bar"><i></i></div>
      设备手册 6 份 · 故障案例 34 条<br>
      索引更新：2026-11-06（本地）
    </div>
    <div class="side-foot">
      <b>演示说明</b><br>
      答案来自页面内预设文本，用于展示「引用手册章节」与「查不到就保守答复」的交互方式。
    </div>
  </aside>

  <div class="main">
    <div class="chat" id="chat"></div>
    <div class="composer">
      <div class="in">
        <div class="quick" id="quick"></div>
        <div class="row">
          <textarea id="input" placeholder="描述现象或输入报警码，例如：E021 液压油温高"></textarea>
          <button class="send" id="send" title="发送">↑</button>
        </div>
        <div class="tools">
          <button class="tool" id="pickPhoto"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="1.5"/><path d="M3 16l5-4 4 3 3-2 6 5"/></svg>上传故障照片</button>
          <button class="tool" id="samplePhoto">用示例照片试一下</button>
          <span class="tool" style="margin-left:auto;color:#5f6d78">Enter 发送 · Shift+Enter 换行</span>
        </div>
        <input type="file" id="file" accept="image/*" hidden>
      </div>
    </div>
  </div>
</div>

<script>
var DEVICES = [
  {id:'im', name:'注塑机 IM-120T', code:'IM-120T / 2019 年产', manual:'《IM-120T 操作与维护手册》 v2.3', state:'运行中'},
  {id:'cnc', name:'立式加工中心 VMC-850', code:'VMC-850 / 2021 年产', manual:'《VMC-850 使用说明书》 v1.8', state:'待机'},
  {id:'air', name:'螺杆空压机 GA-37', code:'GA-37 / 2018 年产', manual:'《GA-37 保养与故障手册》 v3.1', state:'需保养'},
  {id:'laser', name:'光纤激光切割机 3015', code:'LF-3015 / 2020 年产', manual:'《LF-3015 操作手册》 v2.0', state:'运行中'}
];

var ANSWERS = [
  {
    keys:['e021','油温','液压油温','温度高'],
    title:'E021 · 液压油温过高',
    body:'先区分是「散热不良」还是「负载异常」，不要直接复位继续跑。',
    steps:['停机待温降至 45℃ 以下，检查油位是否在视窗中线','清理板式换热器进风口滤网（常见堵塞）','检查冷却水流量与水温，确认冷却塔/冷水机在运行','测液压泵出口压力，异常偏高时排查溢流阀'],
    sec:'第 4.2 节 · 液压系统温度报警',
    snip:'「当油温传感器连续 30 秒检测到高于 65℃ 时，系统输出 E021 并降速运行。处理前须确认散热器表面无明显积尘。」'
  },
  {
    keys:['e105','主轴','异响','噪音','声音'],
    title:'E105 · 主轴异响 / 振动超限',
    body:'先判断是刀具、夹持还是主轴本体，避免把轴承问题当成刀具问题。',
    steps:['空载运行主轴 3000 rpm，听是否有周期性异响','更换刀柄重复测试，排除刀具动平衡问题','检查主轴锥孔清洁与拉钉拉力','记录振动值，若空载仍超 2.8 mm/s 建议停机报修'],
    sec:'第 6.1 节 · 主轴异常振动排查',
    snip:'「空载状态下振动速度有效值持续大于 2.8 mm/s，应停止加工并联系厂家检测主轴轴承。」'
  },
  {
    keys:['压力不足','气压低','压力低','掉压','空压机'],
    title:'气压不足 / 压力上不去',
    body:'按「先泄漏、后机组」的顺序排查，现场最常见的其实是管路泄漏。',
    steps:['停机后听管路是否有持续漏气声，重点查快接与软管','查看储气罐压力表，确认是否机组本身打不上去','检查空气过滤器压差指示，堵塞会导致进气不足','检查进气阀与卸载阀动作是否到位'],
    sec:'第 5.3 节 · 排气压力不足',
    snip:'「若机组满载运行仍低于 0.6 MPa，先排除管路泄漏与过滤器堵塞，再检查进气阀开度。」'
  },
  {
    keys:['保养','保养周期','多久保养','维护'],
    title:'保养周期建议',
    body:'不同设备的周期不同，按运行小时数优先于按自然月。',
    steps:['空压机：每 2000 小时更换空滤、油滤','注塑机：每 500 小时检查液压油位与油温','加工中心：每 250 小时清洁导轨与丝杠润滑','激光切割：每班清洁保护镜片，按切割小时更换'],
    sec:'第 8 节 · 定期保养计划',
    snip:'「保养周期以运行小时数为主，粉尘环境应缩短 20%–30%。」'
  }
];

var activeDev = DEVICES[0];
var chat = document.getElementById('chat');
var input = document.getElementById('input');

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function renderDevs(){
  document.getElementById('devs').innerHTML = DEVICES.map(function(d){
    var cls = 'dev' + (d.id === activeDev.id ? ' on' : '');
    var st = d.state === '需保养' ? 'st w' : 'st';
    return '<button class="'+cls+'" data-dev="'+d.id+'"><span class="'+st+'">'+d.state+'</span><b>'+esc(d.name)+'</b><small>'+esc(d.code)+'</small></button>';
  }).join('');
}

function addSys(text){
  var d = document.createElement('div');
  d.className = 'msg';
  d.innerHTML = '<div class="av ai">AI</div><div class="bub">'+text+'</div>';
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
}

function addMe(text){
  var d = document.createElement('div');
  d.className = 'msg me';
  d.innerHTML = '<div class="av me">你</div><div class="bub">'+esc(text)+'</div>';
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
}

function addTyping(){
  var d = document.createElement('div');
  d.className = 'msg';
  d.id = 'typing';
  d.innerHTML = '<div class="av ai">AI</div><div class="bub typing"><span></span><span></span><span></span></div>';
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
  return d;
}

function answerFor(q){
  var s = q.toLowerCase().replace(/\s/g,'');
  for (var i = 0; i < ANSWERS.length; i++){
    var a = ANSWERS[i];
    for (var j = 0; j < a.keys.length; j++){
      if (s.indexOf(a.keys[j].toLowerCase()) > -1) return a;
    }
  }
  return null;
}

function addAnswer(a){
  var d = document.createElement('div');
  d.className = 'msg';
  d.innerHTML = '<div class="av ai">AI</div><div class="bub">'
    + '<span class="h">'+esc(a.title)+'</span>'
    + '<p>'+esc(a.body)+'</p>'
    + '<ol>'+a.steps.map(function(x){ return '<li>'+esc(x)+'</li>'; }).join('')+'</ol>'
    + '<div class="cite"><b>依据：'+esc(activeDev.manual)+' '+esc(a.sec)+'</b>'
    + esc(a.snip)
    + '<span>引用片段 · 本地知识库命中</span></div>'
    + '</div>';
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
}

function addFallback(q){
  var d = document.createElement('div');
  d.className = 'msg';
  d.innerHTML = '<div class="av ai">AI</div><div class="bub">'
    + '<span class="h"><span class="alarm">未命中</span>知识库里没有这个故障码</span>'
    + '<p>本机的 '+esc(activeDev.name)+' 手册中没有「'+esc(q)+'」对应的条目。离线模式下不做推测，先给保守建议：</p>'
    + '<ol><li>立即停机并断电挂牌，不要反复复位尝试</li><li>拍下报警画面与设备铭牌</li><li>记录故障发生时的工况（负载、温度、动作）</li><li>联系设备厂家或转人工工程师确认</li></ol>'
    + '<div class="safe"><b>为什么这么答：</b>查不到就说明查不到，编一个听起来合理的处理步骤，在现场可能直接造成二次损坏。</div>'
    + '<div style="margin-top:9px"><button class="tool" id="toHuman" style="border:1px solid #4a3a1e;border-radius:5px;padding:5px 10px;color:#e0a23c">转人工 · 生成本地工单</button></div>'
    + '</div>';
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
  var btn = d.querySelector('#toHuman');
  btn.addEventListener('click', function(){
    btn.disabled = true;
    btn.textContent = '已转人工';
    btn.style.opacity = '.55';
    addSys('已生成离线工单 <b class="mono">#M-20261108-014</b>，保存在本机。<br>恢复联网后再同步到服务台（演示动作，未真正发送）。');
  });
}

function ask(q){
  q = (q || '').trim();
  if (!q) return;
  addMe(q);
  input.value = '';
  var t = addTyping();
  setTimeout(function(){
    t.remove();
    var a = answerFor(q);
    if (a) addAnswer(a); else addFallback(q);
  }, 620);
}

function send(){
  ask(input.value);
}

document.getElementById('send').addEventListener('click', send);
input.addEventListener('keydown', function(e){
  if (e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); send(); }
});

document.getElementById('devs').addEventListener('click', function(e){
  var b = e.target.closest('[data-dev]');
  if (!b) return;
  var id = b.getAttribute('data-dev');
  for (var i = 0; i < DEVICES.length; i++) if (DEVICES[i].id === id) activeDev = DEVICES[i];
  renderDevs();
  addSys('已切换到 <b>'+esc(activeDev.name)+'</b>，当前引用知识库：'+esc(activeDev.manual)+'。');
});

var QUICK = ['E021 液压油温高怎么办','主轴有异响','气压上不去','这台机器保养周期多久'];
document.getElementById('quick').innerHTML = QUICK.map(function(q){
  return '<button data-q="'+esc(q)+'">'+esc(q)+'</button>';
}).join('');
document.getElementById('quick').addEventListener('click', function(e){
  var b = e.target.closest('[data-q]');
  if (b) ask(b.getAttribute('data-q'));
});

function photoResult(name){
  addMe('上传故障照片：' + name);
  var t = addTyping();
  setTimeout(function(){
    t.remove();
    var d = document.createElement('div');
    d.className = 'msg';
    d.innerHTML = '<div class="av ai">AI</div><div class="bub">'
      + '<span class="h">照片已在本机分析（模拟结果）</span>'
      + '<div class="photo"><div class="ph"><div><b>PHOTO / 本地缓存</b><span>'+esc(name)+'</span></div></div>'
      + '<div class="rs"><strong>识别结果（预设）：</strong>疑似液压油渗漏，油迹集中在油缸前端密封处。<ol>'
      + '<li>断电泄压后擦拭油迹，静置 10 分钟观察渗出位置</li>'
      + '<li>检查前端密封圈是否老化、有无划伤</li>'
      + '<li>更换密封件后空载运行 15 分钟复查</li></ol></div></div>'
      + '<div class="cite"><b>依据：'+esc(activeDev.manual)+' 第 7.4 节 · 油缸渗漏检查</b>'
      + '「发现渗漏应先泄压，禁止带压紧固螺栓。」<span>图像识别为预设结果，未调用真实模型</span></div>'
      + '</div>';
    chat.appendChild(d);
    chat.scrollTop = chat.scrollHeight;
  }, 900);
}
